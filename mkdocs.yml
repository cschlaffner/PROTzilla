              - "#Proteins / Sample": step-documentation/data-preprocessing/filter-samples-proteins-per-sample.md
              - Sum of Intensities: step-documentation/data-preprocessing/filter-samples-sum-of-intensities.md
          - Filter PSMs:
              - "PEP Threshold": step-documentation/data-preprocessing/filter-psms-pep-threshold.md
              - Existing Proteins: step-documentation/data-preprocessing/filter-psms-existing-proteins.md
              - Existing Samples: step-documentation/data-preprocessing/filter-psms-existing-samples.md
          - Filter Metadata:
