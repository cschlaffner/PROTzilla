site_name: PROTzilla Documentation
site_description: Documentation for PROTzilla
site_url: https://cschlaffner.github.io/PROTzilla/
repo_url: https://github.com/cschlaffner/PROTzilla
repo_name: cschlaffner/PROTzilla

theme:
  name: material

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

watch:
  - backend/protzilla

nav:
  - Home: index.md
  - User Guide:
      - Overview: user-guide.md
      - Installation:
          - Linux: user-guide/Linux.md
          - macOS: user-guide/MacOS.md
          - Windows: user-guide/Windows.md
          - Windows Server 2012: user-guide/WindowsServer2012.md
  - AI Guide: ai-guide.md
  - Step Documentation:
      - Overview: step-documentation.md
      - Importing:
          - Overview: step-documentation/importing.md
          - Example Import:
              - Example Dataset Import: step-documentation/importing/example-dataset-import.md
          - Fasta Import:
              - Fasta Protein Sequence Import: step-documentation/importing/fasta-protein-sequence-import.md
          - Metadata Import:
              - Metadata Import: step-documentation/importing/metadata-import.md
              - Metadata Column Assignment: step-documentation/importing/metadata-column-assignment.md
          - Peptide Import:
              - MaxQuant Peptide Import: step-documentation/importing/maxquant-peptide-import.md
          - Protein Import:
              - DIA-NN Import: step-documentation/importing/dia-nn-import.md
              - MaxQuant Protein Groups Import: step-documentation/importing/maxquant-protein-groups-import.md
              - MS Fragger Combined Protein Import: step-documentation/importing/ms-fragger-combined-protein-import.md
          - PSM Import:
              - MaxQuant Evidence Import: step-documentation/importing/maxquant-evidence-import.md
      - Data Preprocessing:
          - Overview: step-documentation/data-preprocessing.md
          - Filter Peptides:
              - "PEP Threshold": step-documentation/data-preprocessing/filter-peptides-pep-threshold.md
              - Existing Proteins: step-documentation/data-preprocessing/filter-peptides-existing-proteins.md
              - Existing Samples: step-documentation/data-preprocessing/filter-peptides-existing-samples.md
          - Filter Proteins:
              - Missing Samples: step-documentation/data-preprocessing/filter-proteins-missing-samples.md
              - "#Values / Group": step-documentation/data-preprocessing/filter-proteins-values-per-group.md
              - Specific IDs: step-documentation/data-preprocessing/filter-proteins-specific-ids.md
              - Keep n Most Significant: step-documentation/data-preprocessing/filter-proteins-keep-n-most-significant.md
          - Filter Samples:
