          - Classification:
              - Random Forest: step-documentation/data-analysis/classification-random-forest.md
              - SVM: step-documentation/data-analysis/classification-svm.md
              - Model Evaluation: step-documentation/data-analysis/classification-model-evaluation.md
          - Dimension Reduction:
              - t-SNE: step-documentation/data-analysis/dimension-reduction-t-sne.md
              - UMAP: step-documentation/data-analysis/dimension-reduction-umap.md
          - PTM Quantification and Analysis:
              - FLEXIQuant-LF: step-documentation/data-analysis/flexiquant-lf.md
              - MultiFLEX-LF: step-documentation/data-analysis/multiflex-lf.md
              - PTMs per Sample: step-documentation/data-analysis/ptms-per-sample.md
          - PTM Visualisation:
