services:
  prod:
    image: ghcr.io/cschlaffner/protzilla
    build: .
    ports:
      - "8000:8000"

    # volumes:
    # Use this if you want to persistently store user data
    # - '/home/www/.protzilla/user_data:./home/prot/zilla/backend/user_data:Z' # :Z is required for SELinux and should be ignored everywhere else
    # Use this for backend changes to reflect without rebuilding
    # - "./backend:/home/prot/zilla/backend:Z" # :Z is required for SELinux and should be ignored everywhere else
    # - "uniprot:/home/prot/zilla/backend/user_data/external_data/uniprot:Z"

  django:
    image: ghcr.io/cschlaffner/protzilla-django
    build:
      context: .
      dockerfile: "backend/Dockerfile.dev"
    volumes:
      - "./backend:/home/prot/zilla/backend:Z" # :Z is required for SELinux and should be ignored everywhere else
      - "./mcp-server:/home/prot/zilla/mcp-server:Z"
      - "./runner_cli.py:/home/prot/zilla/runner_cli.py:Z"
      - "uniprot:/home/prot/zilla/backend/user_data/external_data/uniprot"
    ports:
      - "5678:5678"
    networks:
      - "dev-network"
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Accept: text/plain", "localhost:8000/healthcheck/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
      start_interval: 1s

  vite:
    image: ghcr.io/cschlaffner/protzilla-vite
    build:
      context: .
      dockerfile: "frontend/Dockerfile.dev"
    environment:
      - VITE_API_URL=http://django
    volumes:
      - "./frontend/src:/prot/zilla/frontend/src:Z" # :Z is required for SELinux and should be ignored everywhere else
      - "pnpm-store:/prot/zilla/frontend/.pnpm-store"
    networks:
      - "dev-network"
    ports:
      - "5173:5173"
    depends_on:
      django:
        condition: service_healthy

  
  storybook:
    image: ghcr.io/cschlaffner/protzilla-vite
    build:
      context: .
      dockerfile: "frontend/Dockerfile.dev"
    environment:
      - "BROWSER=none"
    volumes:
      - "./frontend/src:/prot/zilla/frontend/src:Z" # :Z is required for SELinux and should be ignored everywhere else
      - "./frontend/.storybook:/prot/zilla/frontend/.storybook:Z"
      - "pnpm-store:/prot/zilla/frontend/.pnpm-store"
    entrypoint: ["pnpm", "run", "storybook", "--no-open"]
    ports:
      - "6006:6006"

volumes:
  uniprot:
  node_modules:
  pnpm-store:

networks:
  dev-network:
    driver: bridge 
