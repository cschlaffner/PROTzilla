services:
  prod:
    build: .
    ports:
      - "8000:8000"

    # volumes:
    # Use this if you want to persistently store user data
    # - '/home/www/.protzilla/user_data:./home/prot/zilla/backend/user_data'
    # Use this for backend changes to reflect without rebuilding
    # - "./backend:/home/prot/zilla/backend"

  django:
    build:
      context: .
      dockerfile: "backend/Dockerfile.dev"
    environment:
      - "DEBUG=True"
    volumes:
      - "./backend:/home/prot/zilla/backend"
    networks:
      - "dev-network"

  vite:
    build:
      context: .
      dockerfile: "frontend/Dockerfile.dev"
    environment:
      - VITE_API_URL=http://django
    volumes:
      - "./frontend/src:/prot/zilla/frontend/src"
      - "dist:/home/prot/zilla/frontend/dist"
      - "node_modules:/home/prot/zilla/frontend/node_modules"
      - ".pnpm-store:/home/prot/zilla/frontend/.pnpm-store"
    networks:
      - "dev-network"
    ports:
      - "5173:5173"
    depends_on:
      - "django"

volumes:
  dist:
  node_modules:
  .pnpm-store:

networks:
  dev-network:
    driver: bridge 