crosslinker_reactivity_classes: 
  DSSO: AMINE-REACTIVE # bifunctional NHS-ester crosslinker
  DSS: AMINE-REACTIVE # bifunctional NHS-ester crosslinker
  DSBSO: AMINE-REACTIVE # bifunctional NHS-ester crosslinker
  DSBU: AMINE-REACTIVE # bifunctional NHS-ester crosslinker
  BS3: AMINE-REACTIVE # bifunctional NHS-ester crosslinker
  PHOX: AMINE-REACTIVE # bifunctional NHS-ester crosslinker with phosphonic acid enrichment group

  CDI: AMINE-REACTIVE # carbonyl-based crosslinker with imidazole leaving groups

  PDH/DMTMM: CARBOXYL-REACTIVE # dihydrazide crosslinker with DMTMM coupling reagent
  DHSO/DMTMM: CARBOXYL-REACTIVE # dihydrazide crosslinker with DMTMM coupling reagent

  S-S: DISULFIDE-BOND

AMINE-REACTIVE: 
  primary_reactive_atoms:
    K: # lysine
      - NZ # epsilon-amino nitrogen of the lysine side chain

  terminal_atoms:
    NTERM: # N-terminus (first amino acid of the chain) 
      - N # alpha-amino nitrogen of the N-terminal residue 

  secondary_reactive_atoms:
    S: # serine 
      - OG # hydroxyl oxygen of the side chain
    T: # threonine 
      - OG1 # hydroxyl oxygen of the side chain
    Y: # tyrosine
      - OH # hydroxyl oxygen of the side chain

CARBOXYL-REACTIVE: 
  primary_reactive_atoms:
    D: # aspartate
      - CG # carbonyl carbon of the side-chain carboxyl group
    E: # glutamate
      - CD # carbonyl carbon of the side-chain carboxyl group

  terminal_atoms:
    CTERM: # C-terminus (last amino acid of the chain)
      - C # carbonyl carbon of the terminal carboxyl group

  secondary_reactive_atoms: 
    K: # lysine
      - NZ # epsilon-amino nitrogen of the lysine side chain
    S: # serine
      - OG # hydroxyl oxygen of the side chain
    T: # threonine 
      - OG1 # hydroxyl oxygen of the side chain
    Y: # tyrosine 
      - OH # hydroxyl oxygen of the side chain
    H: # histidine
      - ND1 # imidazole ring nitrogen of the side chain
      - NE2 # imidazole ring nitrogen of the side chain
    C: # cysteine
      - SG # sulfur of the thiol side chain

DISULFIDE-BOND: 
  primary_reactive_atoms:
    C: # cysteine
      - SG # sulfur of the thiol side chain