crosslinker_classes: 
  DSSO: AMINE-REACTIVE #NHS-ESTER
  DSS: AMINE-REACTIVE #NHS-ESTER
  DSBSO: AMINE-REACTIVE #NHS-ESTER
  DSBU: AMINE-REACTIVE #NHS-ESTER
  BS3: AMINE-REACTIVE #NHS-ESTER
  PHOX: AMINE-REACTIVE #NHS-ESTER

  CDI: AMINE-REACTIVE #CARBONYL-ACTIVATED

  PDH/DMTMM: CARBOXYL-REACTIVE #DIHYDRAZIDE+COUPLING-REAGENT
  DHSO/DMTMM: CARBOXYL-REACTIVE #DIHYDRAZIDE+COUPLING-REAGENT

  S-S: DISULFIDEBOND

AMINE-REACTIVE: 
  primary_residue_atoms:
    K: # lysine
      - NZ # terminal nitrogen of the lysine side chain

  terminal_atoms:
    NTERM: # first amino acid of the chain 
      - N # backbone nitrogen of the first amino acid of the chain 

  secondary_residue_atoms:
    S: # serine 
      - OG # hydroxyl-group
    T: # threonine 
      - OG1 # hydroxyl-group
    Y: # tyrosine
      - OH # hydroxyl-group

CARBOXYL-REACTIVE: 
  primary_residue_atoms:
    D: # aspartate
      - CG # side-chain carboxyl carbon
    E: # glutamate
      - CD # side-chain carboxyl carbon

  terminal_atoms:
    CTERM: # last amino acid of the chain 
      - C # carbonyl carbon of the terminal carboxyl group

  secondary_residue_atoms: 
    K:
      - NZ 
    H:
      - ND1
      - NE2 
    Y:
      - OH 
    S:
      - OG 
    T:
      - OG1 
    C:
      - SG 

DISULFIDEBOND: 
  primary_residue_atoms:
    C: # cysteine
      - SG # sulfur of the thiol residue
