modifications:
  # Methyl:
  #   name: Methylation
  #   sites:
  #     - K
  #     - R
  #   color: "#C35728"
  #   above_below: A
  Phospho:
    name: Phosphorylation
    sites:
      - S
      - T
      - Y
    color: "#000000"
    # if the modification should be plotted above (A) or below (B) the protein sequence
    above_below: A
  Acetyl:
    name: Acetylation
    sites:
      - K
    color: "#93478F"
    above_below: A
  GG:
    name: Ubiquitination
    sites:
      - K
    color: "#548056"
    above_below: A
  Citrullination:
    name: Citrullination
    sites:
      - R
    color: "#4682B4"
    above_below: A
  Deamidated:
    name: Deamidation
    sites:
      - N
      - Q
      - R
    color: "#34AEEB"
    above_below: A
color_settings:
  cleavage_label_color: '#333333'
  cleavage_scale_color_high: '#542788'
  cleavage_scale_color_low: '#B35806'
  cleavage_scale_color_mid: '#F7F7F7'
  ptm_scale_color_high: '#01665E'
  ptm_scale_color_low: '#B35806'
  ptm_scale_color_mid: '#F5F5F5'
  sequence_region_colors:
    A: '#FFFFFF'
    B: '#D3D3D3'
  group_label_colors: {}
  # If you want to use your own colors for groups in the details plot, replace the line above with sth. like this:
  # group_label_colors:
  #   Exon: '#F8D480'
  #   Clean: '#20BCC2'
other_settings:
  vertical_orientation: false
  label_angle: 0
